# The crunchyPostgres datasource in renovate.json intentionally tracks a GA
# release instead of postgres-operator main, because main advertises image
# tags for prereleases that the registry does not serve yet. This job walks
# the v6 tags newest-first and reports the newest one whose images are all
# pullable from the registry.
name: Check crunchy-postgres GA release

on:
  schedule:
    # Mondays at 07:30 UTC
    - cron: "30 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-crunchy-ga
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report the newest crunchy-postgres release with published images
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: https://registry.developers.crunchydata.com
        run: |
          set -euo pipefail

          close_tracker_issues() {
            gh issue list --state open \
              --search '"crunchy-postgres datasource" in:title' \
              --json number --jq '.[].number' \
              | xargs -r -n1 gh issue close --reason completed \
                  --comment "renovate.json is pinned to ${pinned}, the newest published crunchy-postgres release."
          }

          pinned=$(
            grep -oE 'postgres-operator/[^/]+/config/components/images-by-tag/kustomization\.yaml' renovate.json \
              | sed -E 's#postgres-operator/([^/]+)/.*#\1#' \
              | head -n1 || true
          )
          if [[ -z "${pinned}" ]]; then
            echo "::error::Could not find the crunchyPostgres datasource pin in renovate.json"
            exit 1
          fi
          if ! [[ "${pinned}" =~ ^v6\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The crunchyPostgres datasource pin '${pinned}' is not a v6 release tag"
            exit 1
          fi

          if ! all_tags=$(gh api --paginate repos/CrunchyData/postgres-operator/tags --jq '.[].name'); then
            echo "::error::Could not list CrunchyData/postgres-operator tags"
            exit 1
          fi
          tags=$(grep -E '^v6\.[0-9]+\.[0-9]+$' <<< "${all_tags}" | sort -V -r || true)
          if [[ -z "${tags}" ]]; then
            echo "::error::No v6 release tags found in CrunchyData/postgres-operator"
            exit 1
          fi

          majors=()
          for dir in images/crunchy-postgres-[0-9]*; do
            [[ -d "${dir}" ]] || continue
            major="${dir#images/crunchy-postgres-}"
            if [[ "${major}" =~ ^[0-9]+$ ]]; then
              majors+=("${major}")
            fi
          done
          if (( ${#majors[@]} == 0 )); then
            echo "::error::Could not find any images/crunchy-postgres-* directories"
            exit 1
          fi

          image_tag() {
            awk -v name="$1" '
              $1 == "-" && $2 == "name:" && $3 == name { found = 1; next }
              found && $1 == "newTag:" { print $2; exit }
            ' <<< "$2"
          }

          # The registry answers the first request with a bearer challenge;
          # exchange it for a short-lived pull token, as docker itself does.
          registry_token() {
            local challenge realm service scope
            challenge=$(curl -sSI --retry 3 --retry-all-errors --max-time 20 \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "${REGISTRY}/v2/crunchydata/crunchy-postgres/manifests/$1" \
              | tr -d '\r' \
              | sed -nE 's/^www-authenticate: Bearer (.*)$/\1/ip')
            if [[ -z "${challenge}" ]]; then
              return 1
            fi
            realm=$(sed -nE 's/.*realm="([^"]+)".*/\1/p' <<< "${challenge}")
            service=$(sed -nE 's/.*service="([^"]+)".*/\1/p' <<< "${challenge}")
            scope=$(sed -nE 's/.*scope="([^"]+)".*/\1/p' <<< "${challenge}")
            curl -fsS --retry 3 --retry-all-errors --max-time 20 \
              "${realm}?service=${service}&scope=${scope}" \
              | sed -E 's/.*"token":"([^"]+)".*/\1/'
          }

          manifest_status() {
            local auth=()
            if [[ -n "${TOKEN}" ]]; then
              auth=(-H "Authorization: Bearer ${TOKEN}")
            fi
            curl -sS -o /dev/null -w '%{http_code}' \
              --retry 3 --retry-all-errors --max-time 20 \
              "${auth[@]}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "${REGISTRY}/v2/crunchydata/crunchy-postgres/manifests/$1"
          }

          TOKEN=""
          token_fetched=false
          published=""

          while IFS= read -r tag; do
            if [[ "${tag}" == "${pinned}" ]]; then
              continue
            fi
            if [[ "$(printf '%s\n%s\n' "${pinned}" "${tag}" | sort -V | tail -n1)" != "${tag}" ]]; then
              break
            fi

            if [[ "${token_fetched}" != "true" ]]; then
              TOKEN=$(registry_token "${tag}" || true)
              token_fetched=true
            fi

            if ! manifest=$(
              gh api -H 'Accept: application/vnd.github.raw' \
                "repos/CrunchyData/postgres-operator/contents/config/components/images-by-tag/kustomization.yaml?ref=${tag}"
            ); then
              echo "::error::Could not read the image list at ${tag}"
              exit 1
            fi

            all_published=true
            for major in "${majors[@]}"; do
              name="image-crunchy-postgres-${major}"
              image=$(image_tag "${name}" "${manifest}")
              if [[ -z "${image}" ]]; then
                echo "::error::${tag} has no ${name} entry"
                exit 1
              fi
              status=$(manifest_status "${image}")
              echo "${tag}: ${name} -> ${image} (${status})"
              if [[ "${status}" == "200" ]]; then
                continue
              fi
              if [[ "${status}" != "404" ]]; then
                echo "::error::Unexpected HTTP ${status} for ${image}"
                exit 1
              fi
              all_published=false
              break
            done

            if [[ "${all_published}" == "true" ]]; then
              published="${tag}"
              break
            fi
          done <<< "${tags}"

          if [[ -z "${published}" ]]; then
            echo "No published release newer than ${pinned}; nothing to do"
            close_tracker_issues
            exit 0
          fi

          title="chore(renovate): bump crunchy-postgres datasource to ${published}"
          printf 'The `crunchyPostgres` datasource in `renovate.json` is pinned to `%s`.\n\nCrunchyData/postgres-operator has tagged `%s`, and every crunchy-postgres image it references is published.\n\nBump the ref in the datasource URL from .../postgres-operator/%s/config/components/images-by-tag/kustomization.yaml to .../postgres-operator/%s/config/components/images-by-tag/kustomization.yaml. Renovate will then propose the image tag updates from that release.\n' "${pinned}" "${published}" "${pinned}" "${published}" > /tmp/issue-body.md

          issue=$(
            gh issue list --state all \
              --search '"crunchy-postgres datasource" in:title' \
              --json number,state \
              --jq '.[0] // empty | "\(.number) \(.state)"'
          )
          if [[ -n "${issue}" ]]; then
            number="${issue%% *}"
            state="${issue##* }"
            gh issue edit "${number}" --title "${title}" --body-file /tmp/issue-body.md
            if [[ "${state}" != "OPEN" ]]; then
              gh issue reopen "${number}"
            fi
            echo "Updated issue #${number} for ${published}"
          else
            gh issue create --title "${title}" --body-file /tmp/issue-body.md
          fi
