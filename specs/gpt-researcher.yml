# spec for building the gpt-researcher backend from the upstream repository
# https://github.com/assafelovic/gpt-researcher
repository: assafelovic/gpt-researcher
ref: v3.8.0
builds:
  - name: gpt-researcher
    imageTags: v3.8.0
    # Time-boxed exceptions for findings in the upstream Python environment.
    # Remove when upstream bumps unstructured and setuptools.
    #
    # CVE-2026-71428 (unstructured URL-partitioning SSRF) is not reachable:
    # gpt_researcher.document.online_document.OnlineDocumentLoader downloads
    # URLs with aiohttp after validate_url(), then parses only local temp
    # files through langchain's Unstructured*Loader. The vulnerable
    # unstructured URL-partitioning entry point is never called.
    #
    # CVE-2025-47273 (setuptools PackageIndex.download path traversal) is
    # build-time only: PackageIndex is not used at runtime, and pip installs
    # from this repository's pinned requirements.
    image_ignore:
      - CVE-2025-47273
      - CVE-2026-71428
    grype_ignore:
      - CVE-2025-47273
      - CVE-2026-71428
