# spec for building Torium, the unofficial Tori.fi MCP server.
# https://github.com/ahnl/torium
# Upstream publishes no release tags; pin main at the current commit.
repository: ahnl/torium
ref: 9a0c0478aceb01bfe0165eb9928f4787140334b5 # torium-commit (2026-06-22)
builds:
  - name: torium
    dockerfile: Dockerfile
    context: .
    platforms: linux/amd64,linux/arm64
    # DATE -> 0.0.YYYYMMDD-<run>.<attempt>; REF -> the commit above.
    imageTags: DATE,REF
